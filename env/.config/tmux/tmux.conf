# ══════════════════════════════════════
# 基础环境
# ══════════════════════════════════════
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",*:RGB"
set -s escape-time 0
set -s extended-keys on
set -sg repeat-time 300
set -s focus-events on
set -g mouse on
set -g history-limit 10000
set -g detach-on-destroy off
set -g status-interval 5
set-hook -g client-session-changed 'refresh-client -S'

# ══════════════════════════════════════
# 编号
# ══════════════════════════════════════
set -g base-index 1
set -w -g pane-base-index 1
set -w -g automatic-rename on
set -g renumber-windows on
# set -g pane-border-status top
# set -g pane-border-format " #{pane_index}: #{pane_current_command} · #{pane_current_path} "

unbind C-b
set -g prefix C-a
bind-key C-a send-prefix

# ══════════════════════════════════════
# 基础操作
# ══════════════════════════════════════
bind b last-window

bind r \
    source-file ~/.config/tmux/tmux.conf \; \
    display-message "~/.config/tmux/tmux.conf reloaded"
bind . command-prompt -p "Project name:" "rename-session '%%'"

bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

bind-key -r f run-shell "tmux neww ~/.local/bin/tmux-sessionizer"

# ══════════════════════════════════════
# 复制模式（vi 风格）
# ══════════════════════════════════════
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode MouseDown1Pane send-keys -X cancel

# ══════════════════════════════════════
# 外观
# ══════════════════════════════════════

# 颜色：Tokyo Night Storm（和 nvim、sketchybar 一致）。
set -g @theme_bg "#24283b"
set -g @theme_surface "#1f2335"
set -g @theme_surface_alt "#292e42"
set -g @theme_border "#565f89"
set -g @theme_text "#c0caf5"
set -g @theme_subtext "#a9b1d6"
set -g @theme_muted "#565f89"
set -g @theme_accent "#7aa2f7"
set -g @theme_on_accent "#24283b"
set -g @theme_success "#9ece6a"
set -g @theme_warning "#ff9e64"
set -g @theme_danger "#f7768e"

set -g status-position bottom
set -g status-style "bg=#{@theme_bg}"
set -g status-justify centre

# ── 左侧：只显示当前会话名（去掉 "数字-" 前缀） ──
set -g status-left-length 40
set -g status-left "#[fg=#{@theme_text},bg=#{@theme_surface_alt}] #{s/^[0-9]+-//:session_name} #[bg=#{@theme_bg}]   "

# ── 右侧：留空 ──
set -g status-right-length 0
set -g status-right ""

# ── Window 列表 ──
setw -g window-status-format "#[fg=#{@theme_muted}]  #W "
setw -g window-status-current-format "#[fg=#{@theme_accent},bold]  #W "
setw -g window-status-separator "|"

# ── 窗格边框 ──
set -g pane-active-border-style "fg=#{@theme_accent}"
set -g pane-border-style "fg=#{@theme_border}"
set -g pane-border-lines heavy
set -g pane-border-indicators arrows
set -g window-style "bg=default"
set -g window-active-style "bg=default"

# ── 消息 & 命令行 ──
set -g message-style "fg=#{@theme_text},bg=#{@theme_surface}"
set -g message-command-style "fg=#{@theme_text},bg=#{@theme_surface}"

# ── 选择模式 ──
set -g mode-style "fg=#{@theme_on_accent},bg=#{@theme_accent}"
